<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c1f" />
      <stop offset="100%" stop-color="#2d1b4e" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ffaa00" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer circle or rounded rect for app icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#ff6600" stroke-width="8" />

  <!-- Graffiti Splatter behind -->
  <path d="M 120 180 Q 80 240 140 320 Q 220 420 320 380 Q 420 340 400 240 Q 380 120 280 100 Q 180 80 120 180 Z" fill="#ff007f" opacity="0.25" filter="url(#neonGlow)"/>
  <circle cx="100" cy="120" r="25" fill="#39ff14" opacity="0.3"/>
  <circle cx="420" cy="380" r="35" fill="#00ffff" opacity="0.3"/>
  <path d="M 400 120 L 440 150 L 410 180 Z" fill="#ffaa00" opacity="0.4"/>

  <!-- Rails graphic -->
  <path d="M 80 440 L 432 440" stroke="#555" stroke-width="12" stroke-linecap="round" />
  <path d="M 80 440 L 432 440" stroke="#aaa" stroke-width="4" stroke-linecap="round" />
  <line x1="130" y1="440" x2="130" y2="460" stroke="#8b5a2b" stroke-width="12" />
  <line x1="210" y1="440" x2="210" y2="460" stroke="#8b5a2b" stroke-width="12" />
  <line x1="290" y1="440" x2="290" y2="460" stroke="#8b5a2b" stroke-width="12" />
  <line x1="370" y1="440" x2="370" y2="460" stroke="#8b5a2b" stroke-width="12" />
  
  <!-- Skateboard / Hoverboard -->
  <path d="M 180 395 C 180 395 210 380 290 380 C 370 380 400 395 400 395 C 410 398 420 390 415 380 C 400 350 360 360 290 360 C 220 360 180 350 165 380 C 160 390 170 398 180 395 Z" fill="url(#glowGrad)" filter="url(#neonGlow)"/>
  <circle cx="210" cy="405" r="14" fill="#333" stroke="#00ffff" stroke-width="4"/>
  <circle cx="370" cy="405" r="14" fill="#333" stroke="#00ffff" stroke-width="4"/>

  <!-- Running Character silhouette/art -->
  <!-- Legs -->
  <path d="M 230 350 L 210 300 L 250 250" stroke="#eef2f7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 270 350 L 310 290 L 270 250" stroke="#eef2f7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Body/Torso -->
  <path d="M 250 250 L 270 170" stroke="#eef2f7" stroke-width="22" stroke-linecap="round" />
  <!-- Arms -->
  <path d="M 270 170 L 320 200 L 350 170" stroke="#ff007f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 270 170 L 220 190 L 190 220" stroke="#ffaa00" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head & Cap -->
  <circle cx="280" cy="130" r="22" fill="#eef2f7" />
  <!-- Graduation cap tilted / Graffiti cap -->
  <path d="M 255 115 L 285 100 L 315 115 L 285 130 Z" fill="#ff007f" />
  <path d="M 285 130 L 285 145" stroke="#ffaa00" stroke-width="3" />
  <circle cx="285" cy="147" r="4" fill="#ffaa00" />
  
  <!-- Dynamic lines (speed lines) -->
  <line x1="80" y1="180" x2="160" y2="180" stroke="#39ff14" stroke-width="6" stroke-dasharray="20,10" filter="url(#neonGlow)"/>
  <line x1="60" y1="240" x2="140" y2="240" stroke="#00ffff" stroke-width="8" stroke-dasharray="30,15" filter="url(#neonGlow)"/>
  <line x1="90" y1="300" x2="170" y2="300" stroke="#ff007f" stroke-width="5" stroke-dasharray="15,10" filter="url(#neonGlow)"/>

  <!-- Text: EXAM ESCAPE -->
  <text x="256" y="80" font-family="'Impact', 'Arial Black', sans-serif" font-size="54" font-weight="900" fill="#39ff14" text-anchor="middle" letter-spacing="4" filter="url(#neonGlow)">EXAM</text>
  <text x="256" y="490" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#ffaa00" text-anchor="middle" letter-spacing="2" filter="url(#neonGlow)">ESCAPE</text>
</svg>
